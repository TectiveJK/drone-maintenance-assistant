name: Build Linux application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to attach packages to'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name DroneMaintenanceAssistant main.py

      - name: Verify PyInstaller executable
        run: test -x dist/DroneMaintenanceAssistant/DroneMaintenanceAssistant

      - name: Create portable Linux archive
        run: tar -czf DroneMaintenanceAssistant-linux-x86_64.tar.gz -C dist DroneMaintenanceAssistant

      - name: Build AppImage
        run: |
          set -e
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp dist/DroneMaintenanceAssistant/DroneMaintenanceAssistant AppDir/usr/bin/DroneMaintenanceAssistant
          chmod +x AppDir/usr/bin/DroneMaintenanceAssistant
          cp drone-maintenance-assistant.svg AppDir/drone-maintenance-assistant.svg
          cp drone-maintenance-assistant.svg AppDir/usr/share/icons/hicolor/scalable/apps/drone-maintenance-assistant.svg
          printf '%s\n' '[Desktop Entry]' 'Name=Drone Maintenance Assistant' 'Comment=First-level drone maintenance and inspection' 'Exec=DroneMaintenanceAssistant' 'Icon=drone-maintenance-assistant' 'Type=Application' 'Categories=Utility;Engineering;' 'Terminal=false' > AppDir/drone-maintenance-assistant.desktop
          cp AppDir/drone-maintenance-assistant.desktop AppDir/usr/share/applications/
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/DroneMaintenanceAssistant" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir DroneMaintenanceAssistant-x86_64.AppImage

      - name: Smoke-test AppImage
        run: |
          chmod +x DroneMaintenanceAssistant-x86_64.AppImage
          timeout 8s ./DroneMaintenanceAssistant-x86_64.AppImage >/tmp/drone-appimage.log 2>&1 || code=$?
          if [ "${code:-0}" -eq 124 ]; then exit 0; fi
          if [ "${code:-0}" -ne 0 ]; then cat /tmp/drone-appimage.log; exit "$code"; fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: DroneMaintenanceAssistant-Linux
          path: |
            DroneMaintenanceAssistant-linux-x86_64.tar.gz
            DroneMaintenanceAssistant-x86_64.AppImage

      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            DroneMaintenanceAssistant-linux-x86_64.tar.gz
            DroneMaintenanceAssistant-x86_64.AppImage
