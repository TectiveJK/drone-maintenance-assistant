name: Build Linux application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release tag to attach packages to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Show source version and commit
        run: |
          echo "Building commit: $(git rev-parse HEAD)"
          grep -n 'APP_VERSION' app/main_window.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux runtime dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb1 libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-cursor0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build one-file executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DroneMaintenanceAssistant main.py

      - name: Verify executable
        run: |
          test -x dist/DroneMaintenanceAssistant
          file dist/DroneMaintenanceAssistant
          ldd dist/DroneMaintenanceAssistant || true

      - name: Create portable Linux archive
        run: tar -czf DroneMaintenanceAssistant-linux-x86_64.tar.gz -C dist DroneMaintenanceAssistant

      - name: Build AppImage
        run: |
          set -e
          rm -rf AppDir
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp dist/DroneMaintenanceAssistant AppDir/usr/bin/DroneMaintenanceAssistant
          chmod +x AppDir/usr/bin/DroneMaintenanceAssistant
          cp drone-maintenance-assistant.svg AppDir/drone-maintenance-assistant.svg
          cp drone-maintenance-assistant.svg AppDir/usr/share/icons/hicolor/scalable/apps/drone-maintenance-assistant.svg
          cat > AppDir/AppRun <<'EOF'
#!/bin/sh
HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
exec "$HERE/usr/bin/DroneMaintenanceAssistant" "$@"
EOF
          chmod +x AppDir/AppRun
          cat > AppDir/drone-maintenance-assistant.desktop <<'EOF'
[Desktop Entry]
Name=Drone Maintenance Assistant
Comment=First-level drone maintenance and inspection
Exec=DroneMaintenanceAssistant
Icon=drone-maintenance-assistant
Type=Application
Categories=Utility;Engineering;
Terminal=false
EOF
          cp AppDir/drone-maintenance-assistant.desktop AppDir/usr/share/applications/
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir DroneMaintenanceAssistant-x86_64.AppImage

      - name: Verify AppImage contents
        run: |
          chmod +x DroneMaintenanceAssistant-x86_64.AppImage
          ./DroneMaintenanceAssistant-x86_64.AppImage --appimage-version
          ./DroneMaintenanceAssistant-x86_64.AppImage --appimage-extract >/tmp/appimage-extract.log
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/DroneMaintenanceAssistant
          head -n 3 squashfs-root/AppRun

      - name: Smoke-test AppImage
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen timeout 12s ./DroneMaintenanceAssistant-x86_64.AppImage 2>&1 | tee /tmp/drone-appimage.log || code=$?
          if [ "${code:-0}" -eq 124 ]; then exit 0; fi
          if [ "${code:-0}" -ne 0 ]; then cat /tmp/drone-appimage.log; exit "${code}"; fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: DroneMaintenanceAssistant-Linux-${{ github.sha }}
          path: |
            DroneMaintenanceAssistant-linux-x86_64.tar.gz
            DroneMaintenanceAssistant-x86_64.AppImage

      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            DroneMaintenanceAssistant-linux-x86_64.tar.gz
            DroneMaintenanceAssistant-x86_64.AppImage
