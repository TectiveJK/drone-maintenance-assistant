name: Build Linux application

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean --windowed --name DroneMaintenanceAssistant main.py

      - name: Create portable Linux archive
        run: tar -czf DroneMaintenanceAssistant-linux-x86_64.tar.gz -C dist DroneMaintenanceAssistant

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp -r dist/DroneMaintenanceAssistant/* AppDir/usr/bin/
          cat > AppDir/drone-maintenance-assistant.desktop <<'EOF'
          [Desktop Entry]
          Name=Drone Maintenance Assistant
          Comment=First-level drone maintenance and inspection
          Exec=DroneMaintenanceAssistant
          Type=Application
          Categories=Utility;Engineering;
          Terminal=false
          EOF
          cp AppDir/drone-maintenance-assistant.desktop AppDir/usr/share/applications/
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir DroneMaintenanceAssistant-x86_64.AppImage

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: DroneMaintenanceAssistant-Linux
          path: |
            DroneMaintenanceAssistant-linux-x86_64.tar.gz
            DroneMaintenanceAssistant-x86_64.AppImage

      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DroneMaintenanceAssistant-linux-x86_64.tar.gz
            DroneMaintenanceAssistant-x86_64.AppImage
